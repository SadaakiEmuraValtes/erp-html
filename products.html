<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>商品マスター | VALTES ERP Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <script src="js/i18n.js"></script>
  <script src="data/master.js"></script>
  <script src="js/core.js"></script>
  <script src="js/layout.js"></script>

  <div id="page" class="hidden">
    <h1 class="page-title" id="page-title"><span data-i18n-en="🗂 Product Master">🗂 商品マスター</span>
      <span class="title-actions"><button class="btn btn-primary" id="btn-new-product" onclick="I18n.go('product.html?mode=new')">＋ <span data-i18n-en="New Product">商品登録</span></button></span></h1>
    <p class="page-desc" data-i18n-en="Search smartphones and tablets by any combination of conditions (AND between fields, OR within multi-select storage / color / status). Conditions are reflected in the URL (e.g. products.html?category=SPH&maker=MK01&storages=128,256).">スマートフォン・タブレットを条件の組み合わせで検索します（項目間はAND、容量・カラー・ステータスの複数選択はOR）。検索条件はURLに反映されます（例：products.html?category=SPH&amp;maker=MK01&amp;storages=128,256）。</p>

    <form class="panel" id="search-form" onsubmit="event.preventDefault();search(1)">
      <div class="panel-head" data-i18n-en="🔍 Search Conditions">🔍 検索条件</div>
      <div class="panel-body">
        <div class="search-grid" id="search-grid">
          <div class="form-group"><label for="s-keyword" data-i18n-en="Keyword (space = AND)">キーワード（スペース区切りでAND）</label><input type="text" id="s-keyword" name="keyword" placeholder="Vフォン 128GB ブラック"></div>
          <div class="form-group"><label for="s-code" data-i18n-en="Product code (partial)">品目コード（部分一致）</label><input type="text" id="s-code" name="code" placeholder="P-100"></div>
          <div class="form-group"><label for="s-category" data-i18n-en="Category">カテゴリ</label><select id="s-category" name="category" onchange="onSeriesFilter()"></select></div>
          <div class="form-group"><label for="s-maker" data-i18n-en="Brand">ブランド</label><select id="s-maker" name="maker" onchange="onSeriesFilter()"></select></div>
          <div class="form-group"><label for="s-subCategory" data-i18n-en="Series">シリーズ</label><select id="s-subCategory" name="subCategory"></select></div>
          <div class="form-group" id="g-price"><label for="s-priceMin" data-i18n-en="Unit price (min - max)">販売単価（下限〜上限）</label>
            <div class="range"><input type="number" id="s-priceMin" name="priceMin" min="0" step="1000" placeholder="0"><span>〜</span><input type="number" id="s-priceMax" name="priceMax" min="0" step="1000"></div>
            <span class="err" id="err-price"></span></div>
          <div class="form-group"><span class="form-label" data-i18n-en="Storage">ストレージ容量</span>
            <div class="check-group" id="s-storages"></div></div>
          <div class="form-group"><span class="form-label" data-i18n-en="Color">カラー</span>
            <div class="check-group" id="s-colors"></div></div>
          <div class="form-group"><span class="form-label" data-i18n-en="Status">ステータス</span>
            <div class="check-group" id="s-statuses"></div></div>
          <div class="form-group"><label for="s-stockStatus" data-i18n-en="Stock status">在庫状態</label><select id="s-stockStatus" name="stockStatus"></select></div>
          <div class="form-group"><label for="s-warehouse" data-i18n-en="Has stock in warehouse">在庫のある倉庫</label><select id="s-warehouse" name="warehouse"></select></div>
          <div class="form-group" id="g-reg"><label for="s-regFrom" data-i18n-en="Release date (from - to)">発売日（から〜まで）</label>
            <div class="range"><input type="date" id="s-regFrom" name="regFrom"><span>〜</span><input type="date" id="s-regTo" name="regTo"></div>
            <span class="err" id="err-reg"></span></div>
          <div class="form-group"><label for="s-sort" data-i18n-en="Sort">並び順</label><select id="s-sort" name="sort"></select></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-clear" onclick="clearForm()" data-i18n-en="Clear">クリア</button>
          <button type="submit" class="btn btn-primary" id="btn-search" data-i18n-en="🔍 Search">🔍 検索</button>
        </div>
      </div>
    </form>

    <div class="toolbar" id="result-toolbar">
      <span class="result-count" id="result-count" data-count="0"></span>
      <span class="result-range" id="result-range"></span>
      <div class="right">
        <label for="s-pageSize" class="muted" data-i18n-en="Rows per page">表示件数</label>
        <select id="s-pageSize" name="pageSize" onchange="search(1)"><option>20</option><option>50</option><option>100</option></select>
        <button class="btn btn-secondary btn-sm" id="btn-export-csv" onclick="exportCsv()" data-i18n-en="⬇ Export CSV">⬇ CSV出力</button>
        <div id="pager-top"></div>
      </div>
    </div>
    <div id="results"></div>
    <div class="pager-bottom" id="pager-bottom"></div>
  </div>

  <script>
    const FIELDS = ["keyword", "code", "category", "maker", "subCategory", "priceMin", "priceMax", "stockStatus", "warehouse", "regFrom", "regTo", "sort", "pageSize"];
    const CHECKS = ["storages", "colors", "statuses"];
    const SORTS = [["code_asc", "品目コード 昇順", "Code (A-Z)"], ["code_desc", "品目コード 降順", "Code (Z-A)"], ["name_asc", "品名 昇順", "Name"],
      ["price_asc", "販売単価 安い順", "Price: low to high"], ["price_desc", "販売単価 高い順", "Price: high to low"],
      ["stock_asc", "有効在庫 少ない順", "Available: low to high"], ["stock_desc", "有効在庫 多い順", "Available: high to low"], ["reg_desc", "発売日 新しい順", "Newest release"]];
    let rows = [], page = 1;

    // 一覧の列定義（data-col / data-value に入る値＝CSV の値）
    const COLUMNS = [
      { key: "code", label: ["品目コード", "Code"], value: r => r.code, html: r => `<a href="${I18n.urlWith("product.html?code=" + r.code)}" id="link-product-${r.code}">${r.code}</a>`, cls: "nowrap" },
      { key: "name", label: ["品名", "Name"], value: r => r.name, html: r => esc(t(r.name, r.nameEn)), cls: "cell-name" },
      { key: "category", label: ["カテゴリ", "Category"], value: r => r.category, html: r => esc(ERP.label.category(r.category)), cls: "nowrap" },
      { key: "maker", label: ["ブランド", "Brand"], value: r => r.maker, html: r => esc(ERP.label.maker(r.maker)), cls: "nowrap" },
      { key: "subCategory", label: ["シリーズ", "Series"], value: r => r.subCategory, html: r => esc(ERP.label.subCategory(r.subCategory)), cls: "nowrap" },
      { key: "storage", label: ["容量", "Storage"], value: r => r.storage, html: r => esc(ERP.label.storage(r.storage)), cls: "nowrap" },
      { key: "color", label: ["カラー", "Color"], value: r => r.color, html: r => esc(ERP.label.color(r.color)), cls: "nowrap" },
      { key: "unitPrice", label: ["販売単価", "Unit price"], value: r => r.unitPrice, html: r => yen(r.unitPrice), cls: "num" },
      { key: "cost", label: ["標準原価", "Cost"], value: r => r.cost, html: r => yen(r.cost), cls: "num" },
      { key: "marginRate", label: ["粗利率", "Margin"], value: r => r.marginRate.toFixed(1), html: r => r.marginRate.toFixed(1) + "%", cls: "num" },
      { key: "totalStock", label: ["総在庫", "On hand"], value: r => r.totalStock, html: r => num(r.totalStock), cls: "num" },
      { key: "available", label: ["有効在庫", "Available"], value: r => r.available, html: r => num(r.available), cls: "num" },
      { key: "stockStatus", label: ["在庫状態", "Stock"], value: r => r.stockStatus, html: r => badge("stockStatus", r.stockStatus) },
      { key: "status", label: ["ステータス", "Status"], value: r => r.status, html: r => badge("status", r.status) },
      { key: "registeredAt", label: ["発売日", "Released"], value: r => r.registeredAt, html: r => dt(r.registeredAt), cls: "nowrap" },
    ];

    document.addEventListener("DOMContentLoaded", () => {
      if (!buildPage({ title: t("商品マスター", "Product Master"), menu: "products", crumbs: [["マスター", "Master Data"], ["商品マスター", "Products"]] })) return;
      if (!ERP.can("product_edit")) { const b = document.getElementById("btn-new-product"); b.disabled = true; b.title = t("この操作の権限がありません", "You do not have permission for this action"); }
      const all = t("すべて", "All");
      document.getElementById("s-category").innerHTML = optionsHtml(OPTS.category(), "", all);
      document.getElementById("s-maker").innerHTML = optionsHtml(OPTS.maker(), "", all);
      document.getElementById("s-stockStatus").innerHTML = optionsHtml(OPTS.stockStatus(), "", all);
      document.getElementById("s-warehouse").innerHTML = optionsHtml(OPTS.warehouse(), "", t("指定なし", "Any"));
      document.getElementById("s-sort").innerHTML = optionsHtml(SORTS.map(s => ({ value: s[0], label: t(s[1], s[2]) })));
      document.getElementById("s-statuses").innerHTML = Object.keys(PRODUCT_STATUS).map(k =>
        `<label for="s-status-${k}"><input type="checkbox" name="s-statuses" id="s-status-${k}" value="${k}">${ERP.label.status(k)}</label>`).join("");
      document.getElementById("s-storages").innerHTML = STORAGES.map(x =>
        `<label for="s-storage-${x.code}"><input type="checkbox" name="s-storages" id="s-storage-${x.code}" value="${x.code}">${ERP.label.storage(x.code)}</label>`).join("");
      document.getElementById("s-colors").innerHTML = COLORS.map(x =>
        `<label for="s-color-${x.code}"><input type="checkbox" name="s-colors" id="s-color-${x.code}" value="${x.code}">${ERP.label.color(x.code)}</label>`).join("");
      onSeriesFilter();
      search(fillSearchForm(FIELDS, CHECKS));
    });

    // シリーズの選択肢をカテゴリ・ブランドで絞る（選択中のシリーズが対象外になったら「すべて」に戻る）
    function onSeriesFilter() {
      const sel = document.getElementById("s-subCategory"), cur = sel.value;
      sel.innerHTML = optionsHtml(OPTS.subCategory(document.getElementById("s-category").value, document.getElementById("s-maker").value), cur, t("すべて", "All"));
    }

    function clearForm() {
      document.getElementById("search-form").reset();
      onSeriesFilter();
      search(1);
    }

    function criteria() {
      const c = readSearchForm(FIELDS, CHECKS);
      return { c, query: c };
    }

    function search(p) {
      const { c, query } = criteria();
      // 入力チェック
      const e = {};
      const bad = v => v !== undefined && (!/^\d+$/.test(v));
      if (bad(c.priceMin) || bad(c.priceMax)) e.price = t("販売単価は0以上の整数で入力してください", "Enter an integer of 0 or more");
      else if (c.priceMin && c.priceMax && Number(c.priceMin) > Number(c.priceMax)) e.price = t("下限は上限以下にしてください", "Min must be less than or equal to max");
      if (c.regFrom && c.regTo && c.regFrom > c.regTo) e.reg = t("開始日は終了日以前にしてください", "From must be on or before To");
      showErrors(e, ["price", "reg"]);
      if (Object.keys(e).length) return;
      rows = ERP.searchProducts(query);
      page = p;
      render();
    }

    function goPage(p) { page = p; render(); document.getElementById("result-toolbar").scrollIntoView({ block: "start", behavior: "smooth" }); }

    function render() {
      const { c } = criteria();
      const size = Number(document.getElementById("s-pageSize").value);
      page = renderPaged(rows, page, size, slice => {
        document.getElementById("results").innerHTML = tableHtml({ id: "product-table", rowPrefix: "product", rows: slice, rowKey: r => r.code, columns: COLUMNS,
          emptyText: t("条件に一致する商品はありません。", "No products match the conditions."),
          rowAttrs: r => `data-status="${r.status}" data-stock-status="${r.stockStatus}"` });
      }, "goPage");
      // 既定値（品目コード昇順・20件）は URL に含めない
      const u = { ...c };
      if (u.sort === "code_asc") delete u.sort;
      if (u.pageSize === "20") delete u.pageSize;
      writeSearchUrl(u, page);
    }

    function exportCsv() {
      downloadCsv(`products_${ERP.today().replace(/-/g, "")}.csv`,
        [...COLUMNS.map(c => c.key), "nameEn", "jan", ...WAREHOUSES.map(w => "stock_" + w.code)],
        rows.map(r => [...COLUMNS.map(c => c.value(r)), r.nameEn, r.jan, ...WAREHOUSES.map(w => r["stock_" + w.code])]));
      toast(t(`${rows.length}件をCSV出力しました`, `Exported ${rows.length} rows`), "success");
    }
  </script>
</body>
</html>
